[package]
name = "portfwd"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/mooreniemi/portfwd"
description = "TUI for managing and discovering SSH port forwards"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"
